# H2 In-Memory Database Profile (For Quick Evaluation / Offline Viva Demo)
server.port=8081
spring.datasource.url=jdbc:h2:mem:aicte_grievance_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
app.seed.enabled=true

# Local-First AI & Similarity Settings (Zero-Cloud / Offline)
app.ai.duplicate.institution-match-bonus=30.0
app.ai.duplicate.category-match-bonus=20.0
app.ai.duplicate.semantic-threshold=0.50
app.ai.duplicate.overall-threshold=45.0
app.ai.classifier.min-confidence-threshold=0.40
