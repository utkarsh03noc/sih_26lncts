# Server Configuration
server.port=8081
server.servlet.context-path=/

# MySQL Database Configuration (Primary)
spring.datasource.url=jdbc:mysql://localhost:3306/aicte_grievance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# File Upload limits (for attachments)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Seed data flag
app.seed.enabled=true

# Logging
logging.level.com.aicte.grievance=INFO
logging.level.org.springframework.security=WARN
